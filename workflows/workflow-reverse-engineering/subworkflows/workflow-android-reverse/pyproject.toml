[project]
name = "workflow-android-reverse"
version = "0.1.0"
description = "课程靶场 Android 请求复现工作流的共享运行环境"
requires-python = ">=3.12,<3.14"
dependencies = [
  "frida==16.0.19",
  "frida-tools==12.3.0",
  "mitmproxy>=11,<13",
  "pycryptodome==3.23.0",
  "requests==2.32.4",
]

[dependency-groups]
dev = [
  "pytest==9.0.2",
  "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/android_reverse_workflow"]
