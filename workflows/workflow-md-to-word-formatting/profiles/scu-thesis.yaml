name: scu-thesis
locale: zh-CN
target: 四川大学学位论文样式
engine_preference: pandoc+python-docx
fonts:
  east_asia: "宋体"
  latin: "Times New Roman"
  other: "Times New Roman"
paragraphs:
  body:
    font_size_pt: 12
    line_spacing_rule: exactly
    line_spacing_pt: 20
    first_line_indent_chars: 2
    alignment: justify
headings:
  h1:
    numbering: "1 / chapter"
    font_east_asia: "黑体"
    font_latin: "Times New Roman"
    font_size_pt: 15
    font_color: "000000"
    bold: true
    alignment: left
    outline_level: 1
    page_break_before: true
  h2:
    numbering: "1.1"
    font_east_asia: "黑体"
    font_latin: "Times New Roman"
    font_size_pt: 14
    font_color: "000000"
    bold: true
    alignment: left
    outline_level: 2
  h3:
    numbering: "1.1.1"
    font_east_asia: "黑体"
    font_latin: "Times New Roman"
    font_size_pt: 12
    font_color: "000000"
    bold: true
    alignment: left
    outline_level: 3
  h4:
    font_east_asia: "楷体_GB2312"
    font_latin: "Times New Roman"
    font_size_pt: 12
    font_color: "000000"
    bold: true
    alignment: left
tables:
  caption_position: above
  caption_font_east_asia: "黑体"
  caption_font_size_pt: 10.5
figures:
  caption_position: below
  caption_font_east_asia: "黑体"
  caption_font_size_pt: 10.5
notes:
  type: footnotes
  font_size_pt: 9
references:
  font_size_pt: 10.5
  line_spacing_rule: exactly
  line_spacing_pt: 20
qc:
  required_checks:
    - openable
    - heading_color
    - heading_size_ladder
    - line_spacing_20pt
    - body_indent
