name: management-world
locale: zh-CN
target: 管理世界投稿正文
engine_preference: pandoc+python-docx
fonts:
  east_asia: "宋体"
  latin: "Times New Roman"
  other: "Times New Roman"
paragraphs:
  body:
    font_size_pt: 10.5
    line_spacing: 1.5
    first_line_indent_chars: 2
    alignment: justify
headings:
  h1:
    numbering: "一、二、三"
    font_east_asia: "黑体"
    font_size_pt: 14
    font_color: "000000"
    alignment: center
    outline_level: 1
  h2:
    numbering: "（一）（二）（三）"
    font_east_asia: "黑体"
    font_size_pt: 10.5
    font_color: "000000"
    alignment: left
    first_line_indent_chars: 2
    outline_level: 2
  h3:
    numbering: "1. 2. 3."
    font_east_asia: "黑体"
    font_size_pt: 10.5
    font_color: "000000"
    alignment: left
    first_line_indent_chars: 2
    outline_level: 3
  h4:
    inline_with_body: true
tables:
  type: three-line
  caption_position: above
  caption_gap: "two-spaces"
figures:
  caption_position: below
  black_white_required: true
  dpi: 600
notes:
  type: endnotes
  numbering: "①②③"
  placement: before-references
qc:
  required_checks:
    - openable
    - mixed_cn_en_font
    - outline_level
    - body_indent
    - table_caption
    - figure_caption
    - endnotes
