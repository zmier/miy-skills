name: financial-research
locale: zh-CN
target: 金融研究投稿正文
engine_preference: pandoc+python-docx
anonymous_required: true
fonts:
  east_asia: "宋体"
  latin: "Times New Roman"
  other: "Times New Roman"
paragraphs:
  body:
    font_size_pt: 12
    line_spacing_rule: exactly
    line_spacing_pt: 20
    first_line_indent_chars: 2
    alignment: justify
headings:
  h1:
    numbering: "一、二、三"
    font_east_asia: "黑体"
    font_size_pt: 12
    font_color: "000000"
    alignment: center
    outline_level: 1
  h2:
    numbering: "（一）（二）（三）"
    font_east_asia: "黑体"
    font_size_pt: 12
    font_color: "000000"
    alignment: left
    outline_level: 2
  h3:
    numbering: "1. 2. 3."
    font_east_asia: "黑体"
    font_size_pt: 12
    font_color: "000000"
    alignment: left
    outline_level: 3
  h4:
    inline_with_body: true
notes:
  type: footnotes
  numbering: "①②③"
  restart: each-page
qc:
  required_checks:
    - openable
    - anonymity
    - line_spacing_20pt
    - body_indent
    - footnotes
